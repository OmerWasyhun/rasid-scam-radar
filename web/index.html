<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASID Scam Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Nastaliq+Urdu&family=Noto+Sans+Devanagari&family=Noto+Sans+Malayalam&family=Noto+Sans+Tamil&family=Noto+Sans+Sinhala&family=Noto+Sans+Bengali&display=swap">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="console">
  <header class="c-head">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#4cc9f0" stroke-width="1.5"/><circle cx="15" cy="15" r="7.5" fill="none" stroke="#4cc9f0" stroke-opacity=".5"/><path d="M15 15 L26 8" stroke="#4cc9f0" stroke-width="1.6"/><circle cx="21" cy="11.5" r="2" fill="#ff5470"/></svg>
      <div>RASID <span class="ar">راصد</span><small>Abu Dhabi Police · Fraud Hunt</small></div>
    </div>
    <form class="cmd" id="cmdform" autocomplete="off">
      <span>&gt;</span>
      <input id="cmd" placeholder="hunt an entity…  e.g. Etihad Airways, Abu Dhabi Grand Prix, Tadbeer" aria-label="Hunt an entity">
      <input id="cmddom" class="dom" placeholder="official domain (optional)" aria-label="Official domain">
      <button class="btn" type="submit">Hunt</button>
    </form>
    <div class="clock"><b id="clock">--:--:--</b><small id="clockdate">GST</small></div>
  </header>

  <div class="kpis">
    <div class="kpi"><b id="k-total">0</b><span>sites &amp; posts analysed</span></div>
    <div class="kpi"><b id="k-flag">0</b><span>flagged (50+)</span></div>
    <div class="kpi"><b id="k-crit">0</b><span>strike queue (80+)</span></div>
    <div class="kpi"><b id="k-act">0</b><span>actors clustered</span></div>
  </div>

  <div class="c-body">
    <nav class="rail" aria-label="Sensors">
      <div class="eyebrow">Sensors</div>
      <div id="sensorlist" class="sensorlist"></div>
      <div class="viewsw" role="group" aria-label="Map view">
        <button id="vw-world" aria-pressed="true">WORLD</button>
        <button id="vw-uae" aria-pressed="false">UAE GROUND</button>
      </div>
      <div class="eyebrow mt">Victim language</div>
      <div class="langs" id="langs"></div>
      <div class="eyebrow mt">Min score</div>
      <input type="range" id="minscore" min="0" max="90" step="10" value="40" aria-label="Minimum score">
      <div class="mono small" id="minscoreval">40+</div>
      <div class="eyebrow mt">Keys</div>
      <div id="keys" class="keys"></div>
    </nav>

    <div class="mapbox">
      <svg id="map" viewBox="0 0 1000 420" role="img" aria-label="Map of detected scam infrastructure"></svg>
      <div class="mapnote" id="mapnote"></div>
      <div class="maplegend" id="legend"></div>
      <div class="jobbar" id="jobbar" hidden><span class="spin"></span><span id="jobmsg">Working…</span></div>
    </div>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-case" aria-selected="true">Case</button>
        <button role="tab" id="t-watch" aria-selected="false">Watch</button>
        <button role="tab" id="t-tools" aria-selected="false">Tools</button>
        <button role="tab" id="t-actors" aria-selected="false">Actors</button>
      </div>
      <div class="pane" id="p-case"></div>
      <div class="pane" id="p-watch" hidden></div>
      <div class="pane" id="p-tools" hidden></div>
      <div class="pane" id="p-actors" hidden></div>
    </aside>
  </div>

  <div class="c-foot">
    <div class="pulse">
      <div class="pulse-h"><span class="eyebrow">Threat pulse · last 24h</span><span class="eyebrow" id="pulseval"></span></div>
      <canvas id="pulse" height="140" aria-label="Detections over 24 hours"></canvas>
      <div class="events" id="events"></div>
    </div>
    <div class="feed">
      <div class="feed-h"><span class="eyebrow">Latest detections</span><span class="eyebrow" id="feedfilter">all languages</span></div>
      <ul id="feed"></ul>
    </div>
  </div>
</div>
<script src="/web/app.js"></script>
</body>
</html>
