# Render's free plan sleeps after 15 minutes without visitors; this visit keeps the hosted demo awake for judges.
name: Keep the hosted demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://rasid-scam-radar.onrender.com/api/status -o /dev/null
