# Render Blueprint: the hosted RASID demo on Render's free plan (Docker, HTTPS).
# Starts from the cases and screenshots in demo/; API keys are entered in the Render dashboard, never in git.
services:
  - type: web
    name: rasid-scam-radar
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/status
    envVars:
      - key: RASID_DEMO_SEED
        value: "1"
      - key: RASID_GUARDIAN_REMOTE
        value: "1"
      - key: RASID_LOW_MEMORY
        value: "1"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
